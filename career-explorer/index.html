<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业规划探索局 - 智能管理系统 V11</title>
<style>
  :root {
    --bg: #0a0e1a; --card-bg: rgba(22, 30, 52, 0.75); --glass-border: rgba(99, 102, 241, 0.15);
    --text-main: #f1f5f9; --text-sub: #64748b; --primary: #6366f1; --accent: #06b6d4;
    --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    --glow: 0 0 20px rgba(99, 102, 241, 0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','SF Pro Display',system-ui,sans-serif; }
  body { background:var(--bg); color:var(--text-main); min-height:100vh; overflow-x:hidden; }
  
  .login-wrapper { position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:#0a0e1a; transition:opacity 0.6s ease; }
  .login-wrapper.hidden { opacity:0; pointer-events:none; }
  .login-canvas { position:absolute; inset:0; z-index:0; }
  .login-card { position:relative; z-index:1; width:420px; max-width:92vw; padding:48px 40px; border-radius:24px; background:rgba(15,23,42,0.85); backdrop-filter:blur(24px); border:1px solid var(--glass-border); box-shadow:var(--glow); text-align:center; }
  .login-logo { font-size:32px; margin-bottom:8px; filter:drop-shadow(0 0 8px rgba(99,102,241,0.6)); }
  .login-title { font-size:22px; font-weight:800; background:linear-gradient(135deg,#818cf8,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; letter-spacing:1px;}
  .login-subtitle { font-size:12px; color:var(--text-sub); margin-bottom:32px; letter-spacing:2px; text-transform:uppercase;}
  .tech-input { width:100%; padding:14px 18px; border-radius:12px; border:1px solid rgba(99,102,241,0.2); background:rgba(15,23,42,0.9); color:#fff; font-size:14px; outline:none; transition:0.3s; margin-bottom:14px; letter-spacing:0.5px;}
  .tech-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
  .tech-input::placeholder { color:rgba(100,116,139,0.6); }
  .tech-btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; letter-spacing:1px; transition:0.3s; position:relative; overflow:hidden;}
  .tech-btn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(99,102,241,0.4); }
  .tech-btn::after { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:linear-gradient(transparent,rgba(255,255,255,0.08),transparent); transform:rotate(45deg); transition:0.5s; }
  .tech-btn:hover::after { left:100%; }
  .login-footer { margin-top:24px; font-size:11px; color:rgba(100,116,139,0.5); letter-spacing:1px;}

  .app-container { display:flex; height:100vh; opacity:0; transition:0.6s ease; }
  .app-container.visible { opacity:1; }
  .sidebar { width:260px; border-right:1px solid var(--glass-border); padding:24px 14px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; background:rgba(10,14,26,0.95); }
  .logo-area { font-size:17px; font-weight:800; padding:0 14px 20px; border-bottom:1px solid var(--glass-border); margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .logo-icon { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#6366f1,#06b6d4); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .nav-section { font-size:10px; font-weight:700; color:var(--text-sub); text-transform:uppercase; padding:18px 14px 8px; letter-spacing:2px;}
  .nav-item { padding:10px 14px; border-radius:10px; cursor:pointer; font-size:13px; color:var(--text-sub); transition:all 0.2s; display:flex; align-items:center; gap:10px; margin-bottom:2px; position:relative;}
  .nav-item:hover { background:rgba(99,102,241,0.08); color:var(--text-main); }
  .nav-item.active { background:rgba(99,102,241,0.15); color:var(--primary); font-weight:600; border-left:3px solid var(--primary); }
  .nav-badge { position:absolute; right:12px; background:var(--danger); color:#fff; font-size:10px; padding:2px 6px; border-radius:10px; font-weight:700;}
  .main-content { flex:1; padding:32px 40px; overflow-y:auto; background:radial-gradient(ellipse at 20% 0%, rgba(99,102,241,0.06) 0%, transparent 60%); }
  .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;}
  .page-title { font-size:26px; font-weight:700; letter-spacing:0.5px; }
  .user-badge { display:flex; align-items:center; gap:10px; padding:8px 16px; border-radius:16px; background:var(--card-bg); border:1px solid var(--glass-border); font-size:13px; backdrop-filter:blur(10px);}
  
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
  .card { background:var(--card-bg); border:1px solid var(--glass-border); border-radius:16px; padding:24px; transition:all 0.25s; backdrop-filter:blur(10px); position:relative;}
  .card:hover { border-color:rgba(99,102,241,0.35); transform:translateY(-2px); box-shadow:0 8px 32px rgba(0,0,0,0.3); }
  .card-title { font-size:15px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .card-desc { font-size:13px; color:var(--text-sub); line-height:1.7; }
  .tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600; }
  .tag-l4 { background:rgba(99,102,241,0.2); color:#818cf8; }
  .tag-l3 { background:rgba(168,85,247,0.2); color:#c084fc; }
  .tag-l2 { background:rgba(245,158,11,0.2); color:#fbbf24; }
  .tag-l1 { background:rgba(16,185,129,0.2); color:#34d399; }
  
  .member-actions, .task-actions { display:flex; gap:8px; margin-top:16px; }
  .act-btn { flex:1; padding:8px; border:none; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; transition:0.2s; }
  .act-edit { background:rgba(99,102,241,0.12); color:var(--primary); }
  .act-edit:hover { background:var(--primary); color:#fff; }
  .act-del { background:rgba(239,68,68,0.08); color:var(--danger); }
  .act-del:hover { background:var(--danger); color:#fff; }
  .act-approve { background:rgba(16,185,129,0.12); color:var(--success); }
  .act-approve:hover { background:var(--success); color:#fff; }
  .act-reject { background:rgba(239,68,68,0.08); color:var(--danger); }
  .act-reject:hover { background:var(--danger); color:#fff; }

  .status-badge { position:absolute; top:16px; right:16px; padding:4px 10px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;}
  .st-pending { background:rgba(245,158,11,0.15); color:var(--warning); border:1px solid rgba(245,158,11,0.3);}
  .st-approved { background:rgba(16,185,129,0.15); color:var(--success); border:1px solid rgba(16,185,129,0.3);}
  .st-rejected { background:rgba(239,68,68,0.15); color:var(--danger); border:1px solid rgba(239,68,68,0.3);}
  .st-progress { background:rgba(6,182,212,0.15); color:var(--accent); border:1px solid rgba(6,182,212,0.3);}
  .st-done { background:rgba(148,163,184,0.15); color:var(--text-sub); border:1px solid rgba(148,163,184,0.3);}

  .modal-overlay { position:fixed; inset:0; background:rgba(10,14,26,0.95); z-index:999; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; backdrop-filter:blur(8px);}
  .modal-overlay.show { opacity:1; pointer-events:auto; }
  .modal-box { background:#131b2e; border:1px solid var(--glass-border); padding:32px; border-radius:20px; width:500px; max-width:92vw; transform:translateY(20px); transition:0.3s; max-height:90vh; overflow-y:auto; box-shadow:var(--glow);}
  .modal-overlay.show .modal-box { transform:translateY(0); }
  .modal-title { font-size:18px; font-weight:700; margin-bottom:20px; text-align:center;}
  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-size:11px; color:var(--text-sub); margin-bottom:6px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase;}
  .form-input, .form-select, .form-textarea { width:100%; padding:12px 16px; border-radius:10px; border:1px solid rgba(99,102,241,0.15); background:rgba(10,14,26,0.8); color:#fff; font-size:14px; outline:none; resize:vertical; transition:0.3s;}
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
  .btn-row { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:0.2s; }
  .btn-primary { background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; }
  .btn-primary:hover { box-shadow:0 4px 16px rgba(99,102,241,0.4); }
  .btn-cancel { background:rgba(255,255,255,0.04); color:var(--text-sub); }
  .btn-cancel:hover { background:rgba(255,255,255,0.08); }

  .toast { position:fixed; top:24px; right:24px; padding:14px 24px; border-radius:12px; font-size:14px; font-weight:500; z-index:1000; transform:translateX(120%); transition:0.3s; backdrop-filter:blur(10px);}
  .toast.show { transform:translateX(0); }
  .toast.success { background:rgba(16,185,129,0.9); color:#fff; }
  .toast.error { background:rgba(239,68,68,0.9); color:#fff; }
  .cloud-status { position:fixed; bottom:20px; right:20px; font-size:11px; color:var(--text-sub); opacity:0.5; display:flex; align-items:center; gap:6px; }
  .cloud-dot { width:6px; height:6px; border-radius:50%; }
  .dot-on { background:var(--success); box-shadow:0 0 6px var(--success); }
  .dot-off { background:var(--warning); }
  .header-btns { display:flex; gap:10px; }
  .action-btn { padding:10px 20px; border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.2s;}

</div>

<div class="modal-overlay" id="taskModal">

        <option value="统筹">统筹</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">截止日期</label><input type="date" id="tDeadline" class="form-input"></div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeTaskModal()">取消</button>
      <button class="btn btn-primary" id="taskSubmitBtn" onclick="saveTask()">确认下发</button>
    </div>
  </div>
</div>

let currentUser = JSON.parse(sessionStorage.getItem('v11_currentUser'))||null;
let currentView = 'dashboard';

function canApprove(){return currentUser&&(ROLE_LEVELS[currentUser.permissions]||0)>=3;}
function isManager(){return currentUser&&currentUser.permissions==='manager';}
function hasModuleAccess(sessionDepts){
  const level=ROLE_LEVELS[currentUser.permissions]||0;
  if(level>=3)return true;
  return sessionDepts.some(dept=>currentUser.department.includes(dept)||currentUser.modules.some(m=>DEPT_MAP[dept]?.includes(m)));
}

async function handleLogin(){
  const account=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  if(!account||!password){showToast('请输入账号和密码','error');return;}
  if(supabaseClient){
    try{
      const{data,error}=await supabaseClient.from('members').select('*').eq('account',account).eq('password',password).single();
      if(data&&!error){currentUser=data;sessionStorage.setItem('v11_currentUser',JSON.stringify(data));onLoginSuccess();showToast(`欢迎回来，${data.name}`,'success');return;}
    }catch(e){}
  }
  const user=members.find(m=>m.account===account&&m.password===password);
  if(!user){showToast('账号或密码错误','error');return;}
  currentUser=user;sessionStorage.setItem('v11_currentUser',JSON.stringify(user));onLoginSuccess();showToast(`欢迎回来，${user.name}`,'success');
}
function onLoginSuccess(){
  document.getElementById('loginWrapper').classList.add('hidden');
  document.getElementById('appContainer').classList.add('visible');
  renderAll();
}
function logout(){currentUser=null;sessionStorage.removeItem('v11_currentUser');location.reload();}

function openMemberModal(member=null){
  document.getElementById('editMemberId').value=member?member.id:'';
  document.getElementById('modalTitle').textContent=member?'编辑成员':'添加新成员';
  document.getElementById('mName').value=member?member.name:'';
  document.getElementById('mAccount').value=member?member.account:'';
  document.getElementById('mPosition').value=member?member.position:'';
  document.getElementById('mDept').value=member?member.department:'统筹';
  document.getElementById('mLevel').value=member?member.permissions:'member';
  document.getElementById('mPassword').value=member?member.password:'';
  document.getElementById('memberModal').classList.add('show');
}
function closeMemberModal(){document.getElementById('memberModal').classList.remove('show');}
async function saveMember(){
  const id=document.getElementById('editMemberId').value;
  const name=document.getElementById('mName').value.trim();
  const account=document.getElementById('mAccount').value.trim();
  const position=document.getElementById('mPosition').value.trim();
  const dept=document.getElementById('mDept').value;
  const level=document.getElementById('mLevel').value;
  const pwd=document.getElementById('mPassword').value.trim();
  if(!name||!account||!pwd){showToast('姓名、账号和密码不能为空','error');return;}
  const duplicate=members.find(m=>m.account===account&&m.id!==id);
  if(duplicate){showToast('该账号已存在','error');return;}
  const colors=['#6366f1','#a855f7','#ec4899','#f59e0b','#10b981','#3b82f6','#0ea5e9','#f97316'];
  const randomColor=colors[Math.floor(Math.random()*colors.length)];
  let mods=DEPT_MAP[dept]?[DEPT_MAP[dept][0]]:['统筹管理'];
  if(level==='admin')mods=['统筹管理','活动策划','对外联络'];
  if(level==='tech_vice')mods=['系统维护','平台开发','数据支持'];
  const memberData={name,account,position,department:dept,permissions:level,password:pwd,modules:mods,avatar:name.charAt(name.length-1),color:randomColor};
  if(id){
    members=members.map(m=>m.id===id?{...m,...memberData}:m);
    if(currentUser&&currentUser.id===id){currentUser={...currentUser,...memberData};sessionStorage.setItem('v11_currentUser',JSON.stringify(currentUser));}
    showToast('成员信息已更新','success');
  }else{
    members.push({id:'m'+Date.now(),...memberData});
    showToast('新成员添加成功','success');
  }
  closeMemberModal();renderAll();
}
async function deleteMember(id){
  if(!confirm('确定删除该成员？'))return;
  if(currentUser&&currentUser.id===id){showToast('不能删除当前账号','error');return;}
  members=members.filter(m=>m.id!==id);showToast('成员已删除','success');
  renderAll();
}
async function handleBatchImport(){
  const raw=document.getElementById('batchData').value.trim();
  if(!raw){showToast('请输入JSON数据','error');return;}
  try{
    const list=JSON.parse(raw);if(!Array.isArray(list))throw new Error();
    let count=0;const colors=['#6366f1','#a855f7','#ec4899','#f59e0b','#10b981','#3b82f6','#0ea5e9','#f97316'];
    for(const item of list){
      if(!item.name||!item.account||!item.password)continue;
      if(members.find(m=>m.account===item.account))continue;
      const dept=item.department||'统筹',perm=item.permissions||'member';
      const mods=DEPT_MAP[dept]?[DEPT_MAP[dept][0]]:['统筹管理'];
      const nm={id:'m'+Date.now()+Math.random().toString(36).substr(2,4),name:item.name,account:item.account,position:item.position||'干事',department:dept,permissions:perm,password:item.password,modules:mods,avatar:item.name.charAt(item.name.length-1),color:colors[Math.floor(Math.random()*colors.length)]};
      members.push(nm);count++;
    }
    showToast(`成功导入 ${count} 名成员`,'success');
    document.getElementById('batchModal').classList.remove('show');document.getElementById('batchData').value='';renderAll();
  }catch(e){showToast('JSON格式错误','error');}
}

// 🆕 任务中心逻辑
function openTaskModal(task=null){
  document.getElementById('editTaskId').value=task?task.id:'';
  const isReq = isManager() && !task; // 部长新建任务即为申请
  document.getElementById('taskModalTitle').textContent = task ? '编辑任务' : (isReq ? '📝 提交任务申请' : '⚡ 直接下发任务');
  document.getElementById('taskSubmitBtn').textContent = task ? '保存修改' : (isReq ? '提交审批' : '确认下发');
  
  document.getElementById('tTitle').value=task?task.title:'';
  document.getElementById('tDesc').value=task?task.desc:'';
  document.getElementById('tAssignee').value=task?task.assignee:(isReq?currentUser.department:'宣传部');
  document.getElementById('tDeadline').value=task?task.deadline:'';
  
  // 部长申请时，只能申请自己部门的任务
  if(isReq) document.getElementById('tAssignee').disabled = true;
  else document.getElementById('tAssignee').disabled = false;

  document.getElementById('taskModal').classList.add('show');
}
function closeTaskModal(){document.getElementById('taskModal').classList.remove('show');}

function saveTask(){
  const id=document.getElementById('editTaskId').value;
  const title=document.getElementById('tTitle').value.trim();
  const desc=document.getElementById('tDesc').value.trim();
  const assignee=document.getElementById('tAssignee').value;
  const deadline=document.getElementById('tDeadline').value;
  if(!title){showToast('任务名称不能为空','error');return;}

  const isReq = isManager() && !id; // 部长新建
  const status = isReq ? 'pending' : 'approved';
  const type = isReq ? 'request' : 'direct';

  if(id){
    customTasks = customTasks.map(t=>t.id===id?{...t,title,desc,assignee,deadline}:t);
    showToast('任务已更新','success');
  }else{
    customTasks.push({id:'t'+Date.now(), title, desc, assignee, deadline, status, creator:currentUser.id, type});
    showToast(isReq?'任务申请已提交，等待上级审批':'任务已成功下发','success');
  }
  closeTaskModal();renderAll();
}

function updateTaskStatus(id, status, reason=''){
  customTasks = customTasks.map(t=>{
    if(t.id===id) return {...t, status, rejectReason: reason};
    return t;
  });
  if(status==='approved') showToast('已批准该任务申请','success');
  if(status==='rejected') showToast('已驳回该任务申请','error');
  if(status==='progress') showToast('任务状态已更新为进行中','success');
  if(status==='done') showToast('任务已标记为完成','success');
  renderAll();
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}

(function initParticles(){
  const canvas=document.getElementById('particleCanvas');const ctx=canvas.getContext('2d');let w,h,particles=[];
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  class Particle{constructor(){this.reset();}reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-0.5)*0.3;this.vy=(Math.random()-0.5)*0.3;this.r=Math.random()*1.5+0.5;this.alpha=Math.random()*0.4+0.1;}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1;}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(99,102,241,${this.alpha})`;ctx.fill();}}
  for(let i=0;i<60;i++)particles.push(new Particle());
  function animate(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.update();p.draw();});for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<120){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(99,102,241,${0.06*(1-dist/120)})`;ctx.lineWidth=0.5;ctx.stroke();}}}requestAnimationFrame(animate);}animate();
})();
